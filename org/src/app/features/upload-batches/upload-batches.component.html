<div class="flex h-full w-full flex-col gap-4">
  <app-header class="w-full" text="Archivos cargados previamente"></app-header>

  <div class="flex flex-row pl-5 text-gray-500">
    <h4 class="w-64">Fecha de carga</h4>
    <h4>Archivos cargados</h4>
  </div>
  <main class="flex w-full flex-col gap-6">
    @if (batches$ | async; as batches) {
      @for (batch of batches; track batch.batch_id) {
        <div
          class="flex flex-row items-center justify-between rounded-2xl bg-gray-50 p-6"
        >
          <div class="flex flex-row gap-10">
            <span>{{ batch.batch_id }}</span>
            <div class="flex flex-row gap-3 text-xs">
              <kbd class="kbd">
                {{ batch.archivos_origen.split(';')[0] }}
              </kbd>
              <kbd class="kbd">
                {{ batch.archivos_origen.split(';')[1] }}
              </kbd>
            </div>
          </div>
          @if (isAdmin) {
            <button
              class="btn btn-secondary"
              [disabled]="isLoading"
              (click)="deleteBatch(batch.batch_id)"
            >
              @if (isLoading) {
                Cargando...
              } @else {
                Eliminar {{ batch.row_count }} registros
              }
            </button>
          } @else {
            <span class="font-bold">{{ batch.row_count }} registros</span>
          }
        </div>
      }
    }
  </main>
</div>
